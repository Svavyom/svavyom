# Four separate, non-root, non-login service identities (each gets a private group of the same name).
u svavyom-api - "Svavyom API"                    /var/lib/svavyom/api /usr/sbin/nologin
u svavyom-ro  - "Svavyom read-only host agent"   -                    /usr/sbin/nologin
u svavyom-mut - "Svavyom mutation supervisor"    /var/lib/svavyom/state /usr/sbin/nologin
u svavyom-con - "Svavyom serial console broker"  -                    /usr/sbin/nologin
# Deliberately absent: no "m <user> libvirt" line. The mutation and console units receive the libvirt group through SupplementaryGroups=
# only while they run; the API and the agent never hold it.
