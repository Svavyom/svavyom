# Trust anchors and operator-managed state: root-owned, closed to group and others for writing. Created empty; the operator
# (root) fills catalog.json and store/ with `api register-image` and installs the config. Runtime services read these only.
d /etc/svavyom                    0755 root root -
d /etc/svavyom/tls                0750 root svavyom-api -
d /var/lib/svavyom                0755 root root -
d /var/lib/svavyom/images         0755 root root -
d /var/lib/svavyom/images/store   0755 root root -
# Default libvirt storage pool directory for VM root and seed volumes. Written by libvirtd (root) only; no Svavyom service writes here.
# It stays empty when the operator names another directory pool in provision.json (INSTALLING.md, "Where VM disks live").
d /var/lib/svavyom/pool           0711 root root -
# Runtime-writable state, one owner each.
d /var/lib/svavyom/api            0700 svavyom-api svavyom-api -
d /var/lib/svavyom/state          0700 svavyom-mut svavyom-mut -
d /var/lib/svavyom/offsite        0700 svavyom-mut svavyom-mut -
# Sockets. The setgid bit makes each socket belong to group svavyom-api, so the API can connect; the peer-uid allowlist in the
# service is the real gate, the directory mode only the first.
d /run/svavyom                    0755 root root -
d /run/svavyom/agent              2750 svavyom-ro  svavyom-api -
d /run/svavyom/mutation           2750 svavyom-mut svavyom-api -
d /run/svavyom/offsite            2750 svavyom-mut svavyom-api -
d /run/svavyom/console            2750 svavyom-con svavyom-api -
