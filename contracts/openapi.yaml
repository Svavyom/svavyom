components:
  securitySchemes:
    ownerSession:
      type: apiKey
      in: cookie
      name: ownerSession
      description: >-
        Opaque server-side session token in an HttpOnly, SameSite=Strict cookie (DR-015 D2; named __Host-svavyom_session
        over HTTPS, svavyom_session otherwise). Cookie-authenticated state-changing requests also need X-CSRF-Token.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,62}$", maxLength: 63}
    Limit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 200}
    Cursor:
      name: cursor
      in: query
      required: false
      schema: {type: string, pattern: "^[A-Za-z0-9_-]{1,128}$", maxLength: 128}
  responses:
    ValidationError:
      description: Typed error (validation)
      x-error-category: validation
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthenticated:
      description: Typed error (unauthenticated)
      x-error-category: unauthenticated
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: Typed error (forbidden)
      x-error-category: forbidden
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Typed error (not_found)
      x-error-category: not_found
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: Typed error (conflict)
      x-error-category: conflict
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Prohibited:
      description: Typed error (prohibited)
      x-error-category: prohibited
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RateLimited:
      description: Typed error (rate_limited)
      x-error-category: rate_limited
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    InternalError:
      description: Typed error (internal)
      x-error-category: internal
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unavailable:
      description: Typed error (unavailable)
      x-error-category: unavailable
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      x-data-class: operational
      properties:
        status:
          type: string
          const: scaffold
          x-data-class: public
    Error:
      type: object
      additionalProperties: false
      required: [category, retryable, correlation_id]
      x-data-class: operational
      description: Typed error. There is no free-text message; the UI shows fixed text per category. field_errors appears only with category validation and names declared request keys only.
      properties:
        category:
          type: string
          enum: [validation, unauthenticated, forbidden, not_found, conflict, rate_limited, prohibited, unavailable, timeout, host_error, internal]
          x-data-class: operational
        retryable:
          type: boolean
          x-data-class: operational
        correlation_id:
          type: string
          pattern: "^[A-Za-z0-9-]{8,64}$"
          maxLength: 64
          x-data-class: operational
        field_errors:
          type: array
          maxItems: 64
          x-data-class: operational
          items:
            type: object
            additionalProperties: false
            required: [field, code]
            x-data-class: operational
            properties:
              field:
                type: string
                pattern: "^[a-z][a-z0-9_]{0,31}$"
                maxLength: 32
                x-data-class: operational
              code:
                type: string
                enum: [required, unknown_field, type, pattern, enum, too_long]
                x-data-class: operational
      oneOf:
        - {properties: {category: {const: validation}, retryable: {const: false}}, required: [category, retryable], x-http-status: 400}
        - {properties: {category: {const: unauthenticated}, retryable: {const: false}}, required: [category, retryable], x-http-status: 401}
        - {properties: {category: {const: forbidden}, retryable: {const: false}}, required: [category, retryable], x-http-status: 403}
        - {properties: {category: {const: not_found}, retryable: {const: false}}, required: [category, retryable], x-http-status: 404}
