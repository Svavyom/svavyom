openapi: 3.1.0
info:
  title: Svavyom Dedicated Cloud API (development)
  version: 0.1.0-dev
  description: >-
    Schema-first definition of the browser-api shapes (M0-E01-S04, DR-012). Implemented: GET /healthz, the
    authentication session (status, sign-in, sign-out), the read-only host summary (DR-015) and the read-only VM inventory. Every other path is
    declared and rejected with a typed Error. Shapes are checked by tools/check_openapi.py; this file is the single source for them.
x-versioning: >-
  The major version is in the path (/api/v1). A new major version needs an approved decision record (DR-012 D6).
paths:
  /healthz:
    get:
      operationId: health
      x-request-category: health
      x-implementation-status: implemented
      security: []
      responses:
        '200':
          description: Development scaffold health
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
  /api/v1/auth/session:
    get:
      operationId: authStatus
      x-request-category: auth_status
      x-implementation-status: implemented
      security: []
      responses:
        '200':
          description: Whether the caller has a valid session. Never fails for lack of a session.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthSession'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      operationId: signIn
      x-request-category: sign_in
      x-implementation-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SignInRequest'}
      responses:
        '200':
          description: Signed in. The session cookie is set; the CSRF token is in the X-CSRF-Token response header.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthSession'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
    delete:
      operationId: signOut
      x-request-category: sign_out
      x-implementation-status: implemented
      security: []
      responses:
        '200':
          description: The session is revoked (idempotent). The caller is anonymous afterwards.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthSession'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/hosts:
    get:
      operationId: listHost
      x-request-category: list_resources
      x-implementation-status: implemented
      security: [{ownerSession: []}]
      parameters:
        - $ref: '#/components/parameters/Limit'
