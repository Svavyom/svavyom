name: CI (pinned toolchain, unprivileged)
# Policy enforced by tools/check_ci_policy.py (make ci-policy).
# Never add root-required or host-mutating tests to shared runners.
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gates:
    name: Quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: cloud-platform
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Host-side safety test runs first, before any container step can modify working-tree files.
      - name: Container safety
        working-directory: cloud-platform
        run: make test-container
      # Every gate a public checkout can run on its own (the maintainers' fuller set also reads a separate, private requirements repository).
      - name: make docker-public-check
        working-directory: cloud-platform
        run: make docker-public-check
      # The browser tier (Chromium, offline, simulated host). Real-KVM qualification is NOT run here: it is a manual privileged tier.
      - name: Browser tier (make docker-fe-browser)
        working-directory: cloud-platform
        run: make docker-fe-browser
