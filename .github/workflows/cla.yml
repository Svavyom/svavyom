name: CLA Assistant
# Contributor licence agreement bot. Reviewed exception to the CI policy (tools/check_ci_policy.py): it needs pull_request_target and a secret, runs no
# contributed code, and does nothing until the repository variable CLA_ENABLED is set to true (after counsel has approved CLA.md).
# Signatures are stored in a separate PRIVATE repository (Svavyom/cla-signatures) through a fine-grained token limited to that repository (secret CLA_SIGNATURES_TOKEN).
on:
  issue_comment:
    types:
      - created
  pull_request_target:
    types:
      - opened
      - closed
      - synchronize
permissions:
  contents: read
jobs:
  cla:
    name: Contributor agreement
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: vars.CLA_ENABLED == 'true' && (github.event_name == 'pull_request_target' || github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')
    permissions:
      actions: write
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          path-to-signatures: signatures/v1/cla.json
          path-to-document: https://github.com/Svavyom/svavyom/blob/main/CLA.md
          branch: main
          remote-organization-name: Svavyom
          remote-repository-name: cla-signatures
